{% set version = "2.6.1" %}

package:
  name: openap
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/o/openap/openap-{{ version }}.tar.gz
  sha256: c861704a0f487ccdf3dcafb9244e6977971bead3f1aab8aded03e8697eb93d36

build:
  noarch: python
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python {{ python_min }}
    - hatchling
    - pip
  run:
    - python >={{ python_min }}
    - numpy
    - scipy
    - pandas
    - pyyaml
    - matplotlib-base

test:
  requires:
    - python {{ python_min }}
  imports:
    - openap

about:
  home: https://github.com/junzis/openap
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE
  summary: Open Aircraft Performance Model (OpenAP) in Python

extra:
  recipe-maintainers:
    - junzis
    - xoolive
